name: SelfProfile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Moodle 4.5 / PHP 8.3 / MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out SelfProfile
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and SelfProfile in the test environment
        id: install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: PHP syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phplint

      - name: Moodle coding standards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHP documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints

      - name: JavaScript and CSS checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # This first workflow checks code and installation only.
      # Add PHPUnit and Behat steps when the plugin has corresponding tests.
